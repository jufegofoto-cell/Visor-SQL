name: Compilar Windows x64

on:
  push:
    tags: ['v*']        # crear el Release v2.4.0 (o la etiqueta) compila y publica los dos .exe
  workflow_dispatch:     # ejecución manual desde la pestaña Actions (deja los .exe como artefactos)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Versión desde la etiqueta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Validar HTML
        run: npm run validate

      - name: Compilar ejecutable portable e instalador (x64)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # sin certificado de firma de código

      - name: Guardar ejecutable portable
        uses: actions/upload-artifact@v7
        with:
          name: VisorSQL-EnergyPlus-portable-x64
          path: dist/*-portable-x64.exe
          if-no-files-found: error

      - name: Guardar instalador
        uses: actions/upload-artifact@v7
        with:
          name: VisorSQL-EnergyPlus-instalador-x64
          path: dist/*-instalador-x64.exe
          if-no-files-found: error

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*-portable-x64.exe
            dist/*-instalador-x64.exe
          generate_release_notes: true
